<!doctype html>
<html>
  <head>
    <title>is same products?</title>
  </head>
  <body>
    <script>
      const product1 = {
        name: "shirt",
        price: 200,
      };

      const product2 = {
        name: "shirt",
        price: 100,
      };

      function isSameProduct(product1, product2) {
        if (
          product1.name === product2.name &&
          product1.price === product2.price
        ) {
          return true;
        } else {
          return false;
        }
      }
      console.log(isSameProduct(product1, product2));
    </script>
  </body>
</html>
