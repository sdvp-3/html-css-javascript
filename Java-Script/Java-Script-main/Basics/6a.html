<!DOCTYPE html>
<html>
  <head>
    <title>Hour practice</title>
  </head>
  <body>
    <script>
      const hour=23;

      if (hour>=6 && hour<=12) {
        console.log('Good morning!')
      } else if(hour>=13 && hour<=17){
        console.log('Good afternoon!')
      } else if(hour>=18 && hour<=23) {
        console.log('Good night!')
      }
    </script>
  </body>
</html>
