function milesToKm(miles){
  return miles*1.6;
}

function milesToFt(miles) {
  return miles*5280;
}

function kmToFt(km){
  return km*3281;
}

function milesToMeters(miles){
  return miles*1600;
}

function convertLengs2(lengs,from,to,unit) {

if (from !== 'miles' && from !== 'km' && from !== 'ft' && from !=='meters') {
    return `Invalid unit: ${from}`;
  }  if (to !== 'miles' && to !== 'km' && to !== 'ft' && to !=='meters') {
    return `Invalid unit: ${to}`;
  }

  if (from===to) {
    return `${lengs}${from==='miles' ? 'miles' : from==='km'? 'km' : 'ft' && from==='miles'? 'miles' : 'meters'}`;
  } if (from==='miles' && to==='km') {
    const result =milesToKm(lengs);
    return `${result}km`;
  } else if (from==='miles' && to==='ft') {
    const result=milesToFt(lengs);
    return `${result}ft`;
  } else if (from==='km' && to==='ft') {
    const result=kmToFt(lengs);
    return `${result}ft`;
  } else if (from==='miles' && to==='meters') {
    const result=milesToMeters(lengs);
    return `${result}m`;
  }
  
}
