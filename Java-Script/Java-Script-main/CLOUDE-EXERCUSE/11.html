  <body>
    <h1 id="h1"></h1>
   

       <script>
      /* 11. Stringni teskari qil ("hello" → "olleh") */


  function array(arr){
    let result=[];

    for(let i=0; i<arr.length; i++){
      let teskari=arr[i].split("").reverse("").join("")
      result.push(teskari)
    }
    return result
  }
  document.querySelector("#h1").innerHTML=array(["hello","saidjon","saidjon","saidjon","saidjon","bekjonboy","saidjon","saidjon","saidjon","bekjonboy","saidjon","saidjon","bekjonboy","saidjon","Alisher","bekjonboy"])
  console.log(array(["hello","saidjon","saidjon","saidjon","saidjon","bekjonboy","saidjon","saidjon","saidjon","bekjonboy","saidjon","saidjon","bekjonboy","saidjon","Alisher","bekjonboy"]))
  
    </script>
