    <script>
      /* 12. Stringdagi harflar sonini hisobla */

      function stringLengh(len){
        let result=[]
     
      for(let i=0; i<len.length; i++){
            let leng=len[i].length
            result.push(leng)
      }
      return result
       }
       console.log(stringLengh(["hello","alkdjaskldjaskldj","good","sooooqeiohjfdokehj"]))
    </script>
