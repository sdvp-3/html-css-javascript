<!doctype html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <h1 id="h1"></h1>
    <script>
      /* 20. Stringni so'zlarga bo'l (split ishlatmasdan) */

      function withoutSplitString(arr) {
        let str = [];
        let current = '';

        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === ' ') {
            if (current.length > 0) {
              str.push(current);
              current = '';
            }
          } else {
            current += arr[i];
          }
        }
        if (current.length > 0) {
          str.push(current);
        }

        return str;
      }
      document.querySelector('#h1').innerHTML =
        withoutSplitString('salom dunyo malak saidjon nimagap qalaysan ishlar yaxshmi');
      console.log(withoutSplitString('salom dunyo malak'));
    </script>
  </body>
</html>
