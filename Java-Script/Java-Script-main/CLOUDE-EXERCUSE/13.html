<!DOCTYPE html>
<html>

  <body>
    <h1 id="h1"></h1>
    <script>
      /* 13. Stringdagi bo'shliqlarni o'chir */
      function array(str){
        let result=[];
        for(let i=0; i<str.length; i++){
          let rem=str[i].replaceAll(" ", "")
          result.push(rem)
        }
        return result;

      }
      document.querySelector("#h1").innerHTML=array(["how hi good"])
      console.log(array(["how hi good"]))
    </script>
  </body>
