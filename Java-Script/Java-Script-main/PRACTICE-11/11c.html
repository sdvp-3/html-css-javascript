    <title>Arrays and Loops</title>

    </style>

  <body>
   
<script>
function arraySwap(array){
 const result=[...array]

 const first=result[0]
 const last=result[result.length-1]

 result[0]=last;
 result[result.length-1]=first;

return result
}

console.log(arraySwap([1,34,54,10]))
console.log(arraySwap(['hi','good','hello']))
</script>
