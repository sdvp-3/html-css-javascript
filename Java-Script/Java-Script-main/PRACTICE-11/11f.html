<!doctype html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style></style>
  </head>
  <body>
    <script>
      let i = 0;
      while (i <= 10) {
        if (i % 2 === 0) {
          console.log(i);
        }
        i++;
      }

      let index = 5;
      while (index >= 0) {
        console.log(index);
        index--;
      }
    </script>
  </body>
</html>
