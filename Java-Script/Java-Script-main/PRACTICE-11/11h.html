    <title>Arrays and Loops</title>

  <body>
   
<script>
function addOne(array){
for(i=0 ; i<array.length; i++){
  array[i]+=1
  }
  return array
}
console.log(addOne([1,2,3]))
console.log(addOne([-1,-2,-3]))

</script>
