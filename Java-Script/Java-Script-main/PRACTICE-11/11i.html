    <title>Arrays and Loops</title>
    <style>

  <body>
   
<script>
function addNum(array,num){
  for(i=0; i<(array.length);i++){
    array[i]*=num
  }
  return array
}
console.log(addNum([1,2,3],2))
console.log(addNum([1,2,3],4))

</script>
