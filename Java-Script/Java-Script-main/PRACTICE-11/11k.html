<!doctype html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style></style>
  </head>
  <body>
    <script>
      function countPositive(nums) {
        let count = 0;
        for (i = 0; i < nums.length; i++) {
          if (nums[i] > 0) {
            count++;
          }
        }
        return count;
      }
      console.log(countPositive([-1, 2, -3, 4, 7, -8]));
    </script>
  </body>
</html>
