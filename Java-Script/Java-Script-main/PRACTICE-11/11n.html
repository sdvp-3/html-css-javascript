<!doctype html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style></style>
  </head>
  <body>
    <script>
      function countWord(words) {
        let result = {};

        for (let i = 0; i < words.length; i++) {
          if (result[words[i]] === undefined) {
            result[words[i]] = 1;
          } else {
            result[words[i]] += 1;
          }
        }
        return result;
      }
      console.log(countWord(["apple", "apple", "grape", "grape", "apple"]));
    </script>
  </body>
</html>
