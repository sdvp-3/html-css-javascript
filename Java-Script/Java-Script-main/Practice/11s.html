<!doctype html>
<html>
  <head>
    <title>Exercise</title>
  </head>
  <body>
    <script>
      function removeEgg(foods) {
        const result = [];
        let eggs = 0;
        for (let i = 0; i < foods.length; i++) {
          if (foods[i] === "egg" && eggs < 2) {
            eggs++;
          } else {
            result.push(foods[i]);
          }
        }
        console.log(result);
      }

      console.log(removeEgg(["egg", "grape", "egg", "egg", "apple"]));
    </script>
  </body>
</html>
