<!doctype html>
<html>
  <head>
    <title>Shipping Calculator</title>
    <style>
      .calculation-button {
        border: none;
        height: 35px;
        width: 90px;
        background-color: green;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .input-button {
        height: 30px;
        outline: none;
      }

      .js-cost {
        color: red;
      }

      body {
        font-family: arial;
      }
    </style>
  </head>
  <body>
    <p>Amazon Shipping Calculator</p>

    <p>Oreder under $40=+$10 shipping</p>
    <p>Order over$40=free shipping</p>

    <input
      placeholder="Cost of product"
      class="js-cost-input input-button"
      onkeydown="handleCostKeydown()"
    />
    <button
      onclick="shippingCalculate()"
      class="js-calculate calculation-button"
    >
      Calculator
    </button>

    <p class="js-cost"></p>

    <script>
      function handleCostKeydown() {
        if (event.key === "Enter") {
          shippingCalculate();
        }
      }

      function shippingCalculate() {
        const inputElement = document.querySelector(".js-cost-input");
        let cost = Number(inputElement.value);
        if (cost < 0) {
          cost = `Error:Cost cannot be less than $0`;
        } else if (cost < 40) {
          cost = cost + 10;
        } else if (cost > 40) {
          cost = cost;
        }

        document.querySelector(".js-cost").innerHTML = `${cost}`;
      }
    </script>
  </body>
</html>
