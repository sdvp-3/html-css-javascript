<!DOCTYPE html>
<html>
  <head>
    <title>Buttons and Paragraph of text</title>
    <style>
      .white-button {
        color: black;
        border-radius: 4px;
        border: 1px solid black;
      }

      .yellow-button {
        background-color: yellow;
      }

      .orange-button {
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <button title="Click" class="white-button" onclick="alert('Good Job');">
      Click
    </button>

    <button>
      Saidjon
    </button>

    <button>
      Apple
    </button>

    <button class="yellow-button">
      Add to cart
    </button>

    <button class="orange-button">
      Buy now
    </button>

    <p>
      Hello, world!
    </p>
  </body>
</html>
