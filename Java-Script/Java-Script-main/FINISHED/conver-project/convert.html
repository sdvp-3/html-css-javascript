<!doctype html>
<html>
  <head>
    <title>KM & MILES CONVERTER</title>
    <link rel="stylesheet" href="convert.css" />
  </head>
  <body>
     <button class="js-mode" onclick=" DarkMode()">Dark Mode</button>
    <div class="main-container">
      
      <div class="tool-name">Fast and Easy Converter</div>

      <div class="container">
        <p class="text">KM ↔ Miles ↔ Meters</p>
        <p>
          <input class="km js-km" type="number" placeholder="km" />
        </p>
        <p class="strelk">↕</p>
        <p>
          <input class="mil js-mil" type="number" placeholder="mil" />
        </p>
        <p class="strelk">↕</p>

        <p>
          <input class="met js-met" type="number" placeholder="met" />
        </p>
      </div>

      <div class="container2">
        <p class="text">M&#178; ↔ Hec ↔ Ft&#178;</p>
        <p>
          <input class="m2 js-m2" type="number" placeholder="m&#178;"/>
        </p>
        <p class="strelk">↕</p>
        <p>
          <input class="hec js-hec" type="number" placeholder="hec" />
        </p>
        <p class="strelk">↕</p>

        <p>
          <input class="ft2 js-ft2 " type="number" placeholder="ft&#178;" />
        </p>
      </div>

      <div class="container3">
        <p class="text">M x M ↔ M&#178;</p>

        <p>
          <input class="am js-am" type="number" placeholder="side(a)m" />
        </p>
        <p class="strelk">↕</p>
        <p>
          <input class="bm js-bm" type="number" placeholder="side(b)m"  />
        </p>
        <p class="strelk">↕</p>

        <p>
          <input class="met2 js-met2" type="number" placeholder=" m&#178;" />
        </p>
      </div>
       <p
        id="alert-box"
       
        class="alert"
      >
        ⚠️!!! 10 billion or Smaller
      </p>
    </div>
  
    <script src="convert.js"
    >
    
    </script>
  </body>
</html>
