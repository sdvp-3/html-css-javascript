<!doctype html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
   
  </head>
  <body>
    <div class="container">
      <p class="js-showcalculation js-top">0</p>
      <p class="js-b">
        <button class="buttons" onclick="addTocalculat('1')">1</button>
        <button class="buttons" onclick="addTocalculat('2')">2</button>
        <button class="buttons" onclick="addTocalculat('3')">3</button>
        <button class="button js-plus" onclick="addTocalculat('+')">+</button>
      </p>

      <p class="js-b">
        <button class="buttons" onclick="addTocalculat('4')">4</button>
        <button class="buttons" onclick="addTocalculat('5')">5</button>
        <button class="buttons" onclick="addTocalculat('6')">6</button>
        <button class="button js-minus" onclick="addTocalculat('-')">-</button>
      </p>

      <p class="js-b">
        <button class="buttons" onclick="addTocalculat('7')">7</button>
        <button class="buttons" onclick="addTocalculat('8')">8</button>
        <button class="buttons" onclick="addTocalculat('9')">9</button>
        <button class="button js-times" onclick="addTocalculat('*')">*</button>
      </p>

      <p class="js-b">
        <button class="buttons" onclick="addTocalculat('0')">0</button>
        <button class="buttons" onclick="addTocalculat('.')">.</button>
        <button class="buttons" onclick="addTocalculat('=')">=</button>
        <button class="button js-divide" onclick="addTocalculat('/')">/</button>
      </p>

      <p class="js-b">
  <button class="button " onclick="addTocalculat('C')">C</button>
   <button class="button" onclick="addTocalculat('backSpace')">&larr;</button>
      </p>
    
    </div>

    <script src="calculator.js">
     
    </script>
  </body>
</html>
