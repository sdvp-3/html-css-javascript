<!doctype html>
<html>
  <head>
    <title>DOM</title>
    <style>
      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        height: 35px;
        width: 100px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
      }

      .calculation-button {
        border: none;
        height: 35px;
        width: 90px;
        background-color: green;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .input-button {
        height: 30px;
        outline: none;
      }
      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      body {
        font-family: Arial;
      }
    </style>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>

    <button onclick="subscribe()" class="js-subscribe-button subscribe-button">
      Subscribe
    </button>

    <p class="">Rock,Paper,Scissors</p>

    <a href="http://127.0.0.1:5500/Games/09-rock-paper-scissors.html">Click</a>

    <p>Amazon Shipping Calculator</p>

    <p>Oreder under $40=+$10 shipping</p>
    <p>Order over$40=free shipping</p>

    <input
      placeholder="Cost of product"
      class="js-cost-input input-button"
      onkeydown="handleCostKeydown()"
    />
    <button
      onclick="shippingCalculate()"
      class="js-calculate calculation-button"
    >
      Calculator
    </button>

    <p class="js-cost"></p>

    <script>
      function handleCostKeydown() {
        if (event.key === "Enter") {
          shippingCalculate();
        }
      }

      function shippingCalculate() {
        const inputElement = document.querySelector(".js-cost-input");
        let cost = Number(inputElement.value);

        if (cost < 40) {
          cost = cost + 10;
        } else if (cost > 40) {
          cost = cost;
        }
        document.querySelector(".js-cost").innerHTML = `Your price:$${cost}`;
      }

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");

        if (buttonElement.innerHTML === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
          buttonElement.classList.add("is-subscribed");
        } else if (buttonElement.innerHTML === "Subscribed") {
          buttonElement.innerHTML = "Subscribe";
          buttonElement.classList.remove("is-subscribed");
        }
      }
    </script>
  </body>
</html>
