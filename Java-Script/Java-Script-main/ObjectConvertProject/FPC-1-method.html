<!doctype html>
<html>
  <head>
    <title>KM & MILES CONVERTER</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .label {
        position: relative;
        display: flex;
        flex-direction: row;
        align-items: center;
        width: 195.44px;
        margin-bottom: 5px;
        margin-top: 5px;
        font-size: 12px;
        color: rgb(75, 209, 68);
        text-shadow: 0px 2px 10px rgb(67, 85, 66);
      }

      .text {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        color: green;
        text-shadow: 0px 2px 10px rgb(67, 85, 66);
      }

      .sign,
      .sign1 {
        color: rgb(16, 238, 105);
        position: absolute;
        left: 50%; /* ← gorizontal markaz */
        transform: translateX(-50%); /* ← aniq markaz */
      }

      .js-km,
      .js-mil,
      .js-meter {
        border: none;
        outline: none;
        color: rgb(57, 37, 37);
        border-radius: 20px;
        font-size: 10px;
        padding-left: 10px;
        width: 173.6px;
        height: 28px;
        padding-right: 8px;
      }

      .js-km:hover,
      .js-mil:hover,
      .js-meter:hover {
        box-shadow: 0px 0px 3px rgb(27, 255, 58);
        transition: 0.8s;
        background-color: rgb(14, 13, 13);
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <!-- input dan keyin qo'shing -->

    <p class="text">KM ↔ Miles ↔ Meters Converter</p>
    <p class="label">Kilometers</p>
    <input type="number" placeholder="km" class="js-km" />
    <div class="label">
      Miles
      <div class="sign">↕</div>
    </div>
    <input type="number" placeholder="miles" class="js-mil" />
    <div class="label">
      Meters
      <div class="sign1">↕</div>
    </div>
    <input type="number" placeholder="meters" class="js-meter" />
    <p id="alert-box" style="display:none; color:red; font-size:11px; margin-top:4px;">
  ⚠️!!! 10 billion or Smaller
</p>

    <script>
      const kmInput = document.querySelector(".js-km");
      const milInput = document.querySelector(".js-mil");
      const meterInput = document.querySelector(".js-meter");

      function kmToMiles(km) {
        return (km / 1.6).toFixed(2);
      }

      function milesToKm(Mil) {
        return (Mil * 1.6).toFixed(2);
      }

      function kmToMeters(km) {
        return (km * 1000).toFixed(2);
      }

      function metersToKm(meters) {
        return (meters / 1000).toFixed(2);
      }

      function metersToMiles(meters) {
        return (meters / 1609.34).toFixed(2);
      }
      function milesToMeters(miles) {
        return (miles * 1609.34).toFixed(2);
      }

      // Km to Miles and Meters

      kmInput.addEventListener("input", function () {
        const val = Number(kmInput.value);
        if(val<=0) return clearAll();
        if(val>=1e10) return alertMessage(val, kmInput);
        milInput.value=kmToMiles(val)
        meterInput.value=kmToMeters(val)
      });
      // Miles to Km and Meters

      milInput.addEventListener("input", function () {
        const val = Number(milInput.value);
        if(val<=0) return clearAll();
        if(val>=1e10) return alertMessage(val, milInput);
        kmInput.value=milesToKm(val)
        meterInput.value=milesToMeters(val)
      });

      // Meters to km and Miles

      meterInput.addEventListener("input", function () {
        const val = Number(meterInput.value);
       if(val<=0) return clearAll();
       if(val>=1e10) return alertMessage(val, meterInput);
        kmInput.value=metersToKm(val)
        milInput.value=metersToMiles(val)


        
      });


      function clearAll() {
         kmInput.value = "";
          milInput.value = "";
          meterInput.value = "";
           
      }
   
     function alertMessage(val, input) {
  if (val >= 1e10) {
    input.value = input.value.slice(0, -1);
    
    // alert o'rniga:
    const box = document.getElementById("alert-box");
    box.style.display = "block";
    
    // 2 soniyadan keyin yo'qolsin:
    setTimeout(() => {
      box.style.display = "none";
    }, 2000);
  }
}
    </script>
  </body>
</html>
