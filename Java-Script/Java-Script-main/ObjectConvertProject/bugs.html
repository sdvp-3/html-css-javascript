<!doctype html>
<html>
  <head>
    <title>Todo List</title>
    <style>
      .deleteBtn {
        background-color: #4caf50;
        border: none;
        color: white;
        padding: 5px 10px;
        border-radius: 7px;
      }
      .li {
        display: flex;
        margin-bottom: 15px;
        row-gap: 30px;
        column-gap: 20px;
        border: 1px solid white;
        border-radius: 8px;
        background-color: #f2f2f2;
        color: black;
        padding-left: 15px;

        width: 200px;
        justify-content: space-between;
        align-items: center;
      }

      .list {
        padding: 0;
        width: 200px;
      }
    </style>
  </head>
  <body>


    <input type="text" id="taskInput" placeholder="Vazifa yozing" />
    <button id="addBtn">Qo'sh</button>
    <ul id="taskList" class="list"></ul>

    <script>
      const addBtnE = document.getElementById("addBtn");
      const taskListE = document.getElementById("taskList");
      const taskInputE = document.getElementById("taskInput");

      addBtnE.addEventListener("click", function () { 
        const task = taskInputE.value;
        if (!task) return;

        const li = document.createElement("li");
        li.textContent = task;
        li.className = "li";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "deleteBtn";
        deleteBtn.textContent = "O'chir";
        deleteBtn.onclick = function () {
          li.remove();
        };

        li.appendChild(deleteBtn);
        taskListE.appendChild(li);

        taskInputE.value = "";
      });
    </script>
  </body>
</html>
